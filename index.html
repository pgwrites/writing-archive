<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payal Gusain — Writing Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --paper: #FFFFFF;
    --ink: #000000;
    --name-red: #8B0000;
    --line: #000000;
    --font-archaic: 'IM Fell English', 'IM Fell English SC', Georgia, serif;
    --max-w: 1180px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--font-archaic);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink); color:var(--paper);}

  /* ---------- Header image strip ---------- */
  .header-strip{
    display:flex;
    width:100%;
    height:260px;
    gap:4px;
    padding:0;
  }
  .header-strip a, .header-strip .frame{
    display:block;
    height:100%;
    overflow:hidden;
    border:1px solid var(--ink);
  }
  .header-strip img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  /* Outer four images share ~18% each, centre image ("wild geese") gets ~28% */
  .header-strip .frame{ flex:1 1 18%; }
  .header-strip .frame.centre{ flex:1 1 28%; }

  @media (max-width: 760px){
    .header-strip{
      height:220px;
      overflow-x:auto;
      -webkit-overflow-scrolling:touch;
    }
    .header-strip .frame,
    .header-strip .frame.centre{
      flex:0 0 200px;
    }
  }

  /* ---------- Top fold ---------- */
  .topfold{
    background:var(--paper);
    padding:48px 32px 24px;
  }
  .topfold-inner{
    max-width:var(--max-w);
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:40px;
    flex-wrap:wrap;
  }
  .topfold-main{
    flex:1;
    min-width:260px;
  }
  .topfold-main h1{
    font-family:var(--font-archaic);
    font-weight:400;
    font-size:clamp(32px, 4.5vw, 46px);
    margin:0 0 10px;
    color:var(--name-red);
  }
  .role-label{
    font-family:Georgia, serif;
    font-size:15px;
    color:#333;
    letter-spacing:0.02em;
    margin:0 0 16px;
  }
  .topfold-main p.bio{
    font-family:var(--font-archaic);
    font-style:italic;
    font-size:19px;
    line-height:1.6;
    color:var(--ink);
    max-width:62ch;
    margin:0;
  }
  .bio.placeholder{
    color:#666;
    border-left:2px solid var(--ink);
    padding-left:14px;
  }
  .topfold-links{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-top:6px;
    font-family:Georgia, serif;
    font-size:14px;
    text-align:right;
  }
  .topfold-links a{
    color:var(--ink);
    text-decoration:underline;
    text-underline-offset:3px;
  }
  .topfold-links a:hover{
    color:var(--name-red);
  }
  @media (max-width: 600px){
    .topfold-links{
      text-align:left;
      align-items:flex-start;
    }
  }

  /* ---------- Layout ---------- */
  .layout{
    max-width:none;
    margin:0;
    padding:28px 56px 90px;
    display:grid;
    grid-template-columns:1fr 300px;
    gap:56px;
    align-items:start;
  }
  @media (max-width: 880px){
    .layout{grid-template-columns:1fr; gap:0; padding-left:20px; padding-right:20px;}
  }

  /* ---------- Left: content list ---------- */
  .list-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .list-header h2{
    font-family:var(--font-archaic);
    font-size:24px;
    font-weight:400;
    color:var(--ink);
    margin:0;
  }
  .result-count{
    font-size:13px;
    color:#555;
    font-family:Georgia, serif;
  }
  #mobileFilterToggle{
    display:none;
    width:100%;
    margin-bottom:18px;
    padding:12px 16px;
    background:var(--paper);
    border:1px solid var(--ink);
    font-family:var(--font-archaic);
    font-size:15px;
    color:var(--ink);
    text-align:left;
  }
  @media (max-width: 880px){
    #mobileFilterToggle{display:block;}
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:36px 28px;
  }
  @media (max-width: 560px){
    .grid{grid-template-columns:1fr;}
  }

  .card{
    display:flex;
    flex-direction:column;
  }
  .card .thumb{
    display:block;
    width:100%;
    aspect-ratio:1.9 / 1;
    overflow:hidden;
    background:#EEE;
    border:1px solid var(--ink);
  }
  .card .thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .card .card-title{
    font-family:var(--font-archaic);
    font-size:19px;
    font-weight:700;
    line-height:1.35;
    color:var(--ink);
    margin:14px 0 6px;
  }
  .card .card-title:hover{color:var(--name-red);}
  .card .card-meta{
    font-family:Georgia, serif;
    font-size:12.5px;
    color:#555;
    margin:0;
  }
  .card .card-meta .sep{margin:0 6px;}

  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:#555;
    font-family:var(--font-archaic);
    font-style:italic;
    font-size:18px;
  }

  /* ---------- Right: filters ---------- */
  .filters{
    background:var(--paper);
    border:1px solid var(--ink);
    padding:16px 18px;
    position:sticky;
    top:24px;
  }
  @media (max-width: 880px){
    .filters{
      display:none;
      position:static;
      margin-bottom:24px;
    }
    .filters.open{display:block;}
  }
  .filters h3{
    font-family:var(--font-archaic);
    font-size:15px;
    font-weight:400;
    color:var(--ink);
    margin:0 0 10px;
    border-bottom:1px solid var(--ink);
    padding-bottom:6px;
  }
  .filter-group{margin-bottom:14px;}
  .filter-group:last-child{margin-bottom:0;}
  .filter-group h4{
    font-family:Georgia, serif;
    font-size:11px;
    font-weight:700;
    color:#555;
    text-transform:uppercase;
    letter-spacing:0.05em;
    margin:0 0 6px;
  }
  .check-row{
    display:flex;
    align-items:center;
    gap:8px;
    padding:3px 0;
    cursor:pointer;
    font-family:Georgia, serif;
    font-size:13px;
    color:var(--ink);
  }
  .check-row input{
    width:13px;
    height:13px;
    accent-color:var(--ink);
    cursor:pointer;
  }
  .clear-filters{
    margin-top:12px;
    font-family:Georgia, serif;
    font-size:12px;
    font-weight:700;
    color:var(--name-red);
    background:none;
    border:none;
    padding:0;
    cursor:pointer;
  }

  .status-banner{
    max-width:var(--max-w);
    margin:20px auto 0;
    padding:14px 18px;
    background:#F5F5F5;
    border:1px solid var(--ink);
    font-family:Georgia, serif;
    font-size:13.5px;
    line-height:1.6;
  }
  .status-banner code{
    background:#00000010;
    padding:1px 6px;
    font-size:12.5px;
  }

</style>
</head>

// Used whenever a row has no thumbnail, or a hotlinked thumbnail URL breaks
// (e.g. the source site moves/deletes the image). This can never 404.
const DEFAULT_THUMBNAIL = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 460 200'%3E%3Crect width='460' height='200' fill='%23FFFFFF'/%3E%3Crect x='1' y='1' width='458' height='198' fill='none' stroke='%23000000' stroke-width='2'/%3E%3Ccircle cx='230' cy='100' r='28' fill='none' stroke='%23000000' stroke-width='1.5'/%3E%3Cline x1='210' y1='80' x2='250' y2='120' stroke='%23000000' stroke-width='1.5'/%3E%3Cline x1='250' y1='80' x2='210' y2='120' stroke='%23000000' stroke-width='1.5'/%3E%3C/svg%3E";

// Manually-added pieces that always appear in the list, regardless of
// whether CSV_URL is connected or demo data is showing. Use this for
// anything hosted locally alongside the site (like PDFs) that ISN'T
// already a row in your spreadsheet. The BLR Airport PDF used to live
// here, but it's now a row in the live sheet instead, so this is empty
// to avoid showing it twice.
const MANUAL_ENTRIES = [];

const DEMO_DATA = [
  {Title:"Rebuilding a SaaS Onboarding Flow from Scratch", Thumbnail:"https://images.unsplash.com/photo-1551288049-bebda4e38f71?w=400&q=80", URL:"#", Date:"2025-11-02", Industry:"SaaS", Format:"Case Study"},
  {Title:"A Landing Page That Cut Bounce Rate by 40%", Thumbnail:"https://images.unsplash.com/photo-1460925895917-afdab827c52f?w=400&q=80", URL:"#", Date:"2025-09-18", Industry:"Fintech", Format:"Landing Page"},
  {Title:"Why Most Travel Booking Flows Lose Users at Step 3", Thumbnail:"https://images.unsplash.com/photo-1488646953014-85cb44e25828?w=400&q=80", URL:"#", Date:"2025-08-30", Industry:"Travel", Format:"Blog Post"},
  {Title:"Designing for Trust: Guest Post on Fintech UX", Thumbnail:"https://images.unsplash.com/photo-1563013544-824ae1b704d3?w=400&q=80", URL:"#", Date:"2025-07-14", Industry:"Fintech", Format:"Guest Post"},
  {Title:"The Anatomy of a High-Converting Pricing Page", Thumbnail:"https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?w=400&q=80", URL:"#", Date:"2025-06-05", Industry:"SaaS", Format:"Landing Page"},
  {Title:"Case Study: Redesigning a Healthcare Intake Form", Thumbnail:"https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?w=400&q=80", URL:"#", Date:"2025-04-22", Industry:"Healthcare", Format:"Case Study"},
  {Title:"What I Learned Writing 30 Guest Posts in a Year", Thumbnail:"https://images.unsplash.com/photo-1499750310107-5fef28a66643?w=400&q=80", URL:"#", Date:"2025-03-11", Industry:"Personal", Format:"Blog Post"},
  {Title:"A Travel Startup's Homepage, Line by Line", Thumbnail:"https://images.unsplash.com/photo-1499591934245-40b55745b905?w=400&q=80", URL:"#", Date:"2025-01-27", Industry:"Travel", Format:"Landing Page"},
];

function normalizeRow(row){
  const get = (...keys) => {
    for (const k of Object.keys(row)){
      if (keys.includes(k.trim().toLowerCase())) return row[k];
    }
    return "";
  };
  return {
    title: (get("title") || "Untitled").trim(),
    thumbnail: (get("thumbnail","image","thumb") || "").trim(),
    url: (get("url","link","article url") || "#").trim(),
    date: (get("date","date (year)","year") || "").trim(),
    industry: (get("industry","category") || "Uncategorized").trim(),
    format: (get("format","type") || "Uncategorized").trim(),
  };
}

function formatDate(d){
  const parsed = new Date(d);
  if (isNaN(parsed)) return d;
  return parsed.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'});
}

// Shows just the publication year on cards, regardless of whether the
// sheet has a full date or already just a year.
function displayYear(dateStr){
  const match = String(dateStr || '').match(/\d{4}/);
  return match ? match[0] : (dateStr || '');
}

// Pulls a 4-digit year out of whatever's in the Date field (handles "2023",
// full dates, or blanks). Blank/unparseable dates sort as 0 — oldest/last —
// instead of corrupting the whole list's order the way NaN comparisons do.
function sortYear(dateStr){
  const match = String(dateStr || '').match(/\d{4}/);
  const year = match ? parseInt(match[0], 10) : 0;
  return isNaN(year) ? 0 : year;
}

let ALL_ITEMS = [];
let activeIndustries = new Set();
let activeFormats = new Set();

function buildFilterGroup(containerId, values, activeSet){
  const container = document.getElementById(containerId);
  container.innerHTML = values.map(v => `
    <label class="check-row">
      <input type="checkbox" value="${v}">
      <span>${v}</span>
    </label>
  `).join('');
  container.querySelectorAll('input').forEach(input => {
    input.addEventListener('change', (e) => {
      if (e.target.checked) activeSet.add(e.target.value);
      else activeSet.delete(e.target.value);
      drawList();
    });
  });
}

function drawList(){
  const filtered = ALL_ITEMS.filter(i => {
    const matchIndustry = activeIndustries.size === 0 || activeIndustries.has(i.industry);
    const matchFormat = activeFormats.size === 0 || activeFormats.has(i.format);
    return matchIndustry && matchFormat;
  });

  document.getElementById('resultCount').textContent =
    `${filtered.length} piece${filtered.length === 1 ? '' : 's'}`;

  const grid = document.getElementById('grid');
  const empty = document.getElementById('emptyState');

  if (!filtered.length){
    grid.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map(i => {
    const metaText = [i.format, i.industry].filter(Boolean).join(' <span class="sep">·</span> ');
    return `
    <div class="card">
      <a class="thumb" href="${i.url}" target="_blank" rel="noopener">
        <img src="${i.thumbnail || DEFAULT_THUMBNAIL}" alt="${i.title}" loading="lazy" onerror="this.onerror=null;this.src='${DEFAULT_THUMBNAIL}';">
      </a>
      <a class="card-title" href="${i.url}" target="_blank" rel="noopener">${i.title}</a>
      <p class="card-meta">${metaText}</p>
    </div>
  `;
  }).join('');
}

function render(items){
  ALL_ITEMS = items;
  const industries = Array.from(new Set(items.map(i => i.industry).filter(Boolean))).sort();
  const formats = Array.from(new Set(items.map(i => i.format).filter(Boolean))).sort();
  buildFilterGroup('industryFilters', industries, activeIndustries);
  buildFilterGroup('formatFilters', formats, activeFormats);
  drawList();
}

document.getElementById('clearFilters').addEventListener('click', () => {
  activeIndustries.clear();
  activeFormats.clear();
  document.querySelectorAll('.filters input[type="checkbox"]').forEach(cb => cb.checked = false);
  drawList();
});

document.getElementById('mobileFilterToggle').addEventListener('click', () => {
  document.getElementById('filtersPanel').classList.toggle('open');
});

function showBanner(message){
  document.getElementById('statusBanner').innerHTML = `<div class="status-banner">${message}</div>`;
}

function loadDemo(reason){
  if (reason) showBanner(reason);
  const items = [...MANUAL_ENTRIES, ...DEMO_DATA].map(normalizeRow);
  render(items);
}

function loadFromUrl(url, onFail){
  Papa.parse(url, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: (results) => {
      if (!results.data || !results.data.length){
        onFail(`loaded but returned 0 rows`);
        return;
      }
      const items = [...MANUAL_ENTRIES, ...results.data].map(normalizeRow);
      render(items);
    },
    error: (err) => {
      console.error('CSV load failed for', url, err);
      onFail(err && err.message ? err.message : 'unknown fetch error');
    }
  });
}

if (!CSV_URL){
  loadDemo(`Showing demo content. Paste your published Google Sheet CSV link into <code>CSV_URL</code> near the top of the script to load your real work.`);
} else {
  loadFromUrl(CSV_URL, (primaryError) => {
    console.warn('Primary CSV_URL failed (' + primaryError + '), trying fallback...');
    loadFromUrl(CSV_URL_FALLBACK, (fallbackError) => {
      console.warn('Fallback CSV_URL failed (' + fallbackError + '), trying CORS proxy...');
      loadFromUrl(CSV_URL_PROXY, (proxyError) => {
        loadDemo(`Couldn't load your sheet via any method (direct: <code>${primaryError}</code>, gviz: <code>${fallbackError}</code>, proxy: <code>${proxyError}</code>). Check the browser console for details. Showing demo content instead.`);
      });
    });
  });
}
</script>
